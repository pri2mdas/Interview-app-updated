# ─────────────────────────────────────────────────────────────────────────────
# nginx config for the Take My Interview frontend.
#
# Serves the static React bundle and reverse-proxies /api/* to the backend
# service in the docker-compose network.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — safe defaults for a SPA
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip static assets (cheap win for the bundled JS/CSS)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Cache hashed assets aggressively (CRA filenames include content hashes)
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API requests to the backend service.
    # `backend` resolves to the backend container on the docker-compose network.
    # client_max_body_size matches the backend's 25 MB audio upload limit.
    location /api/ {

        proxy_pass http://172.19.0.3:7000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        client_max_body_size  25m;
        proxy_buffering       off;
    }

    # SPA fallback — any non-asset GET that doesn't match a file returns index.html
    # so client-side routes (/interview/:id, /report/:id, etc.) work on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html so deploys pick up new bundles immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Surface nginx errors instead of falling back to the SPA shell
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
