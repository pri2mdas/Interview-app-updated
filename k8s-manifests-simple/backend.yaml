# ─────────────────────────────────────────────────────────────────────────────
# Backend (FastAPI) — ConfigMap + Secret + Deployment + Service, in one file.
# envFrom merges both refs; secrets override configmaps on key collision.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: tmi
data:
  HOST: "[REDACTED-IP_ADDRESS]"
  PORT: "7000"
  CORS_ORIGINS: "[REDACTED-URL]"
  DB_POOL_MAX: "10"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: tmi
type: Opaque
stringData:
  # In-cluster DNS: postgres.tmi.svc.cluster.local:5432
  DATABASE_URL: "postgresql://tmi:PLACEHOLDER_USE_OPENSSL_RAND_BASE64_24_TO_GENERATE@postgres:5432/tmi"
  GEMINI_API_KEY: "AQ.Ab8RN6JvRXQmP5Be3TalIdtZ8Utax-fICi6jEp9_xmnPxCgz4g"
  TMI_JWT_SECRET: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tmi
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: backend
          image: quantumpritam/take-my-interview:backend-v1.2
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tmi
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 7000
      targetPort: 7000
      name: http
