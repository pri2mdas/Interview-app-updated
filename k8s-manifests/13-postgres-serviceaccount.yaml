# =============================================================================
# Dedicated ServiceAccount for the postgres pod. No API access needed, so we
# explicitly disable token automounting and grant no RBAC.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: tmi
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: take-my-interview
automountServiceAccountToken: false
