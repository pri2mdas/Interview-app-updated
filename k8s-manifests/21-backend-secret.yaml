# =============================================================================
# Backend secrets.
# Replace the placeholder values with real ones via:
#   * sealed-secrets    (`kubeseal`)
#   * external-secrets  (Vault / AWS SM / GCP SM)
#   * or `kubectl create secret` before the first apply.
# Never commit real credentials to git.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: tmi
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: take-my-interview
type: Opaque
stringData:
  # Full DSN for psycopg2. Use the in-cluster service DNS:
  # postgres.tmi.svc.cluster.local:5432
  DATABASE_URL: "[REDACTED-DATABASE-CONNECTION-STRING]:5432/tmi"
  # Google Gemini API key (used by the LLM interviewer + STT endpoint).
  GEMINI_API_KEY: "REPLACE_ME"
  # Long random string used to sign JWTs. `openssl rand -base64 48`
  TMI_JWT_SECRET: "REPLACE_ME"
