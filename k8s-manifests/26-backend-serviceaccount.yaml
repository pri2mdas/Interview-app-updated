# =============================================================================
# Backend ServiceAccount — no API access required, so token automounting is
# disabled and no RBAC bindings are created.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: tmi
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: take-my-interview
automountServiceAccountToken: false
