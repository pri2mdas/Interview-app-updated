# =============================================================================
# Frontend HPA — nginx is mostly static, but a brief burst during deploys or
# cold caches can justify a quick scale-up.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: tmi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: take-my-interview
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
