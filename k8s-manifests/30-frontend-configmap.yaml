# =============================================================================
# Frontend nginx configuration — reverse-proxies /api/* to the backend
# service. Mounted into the nginx pod so we can reconfigure per environment
# without rebuilding the image.
#
# The REACT_APP_BACKEND_URL baked into the JS bundle is the *browser-visible*
# API URL; this proxy handles server-side / internal callers (none today,
# but keeps the door open for SSR / health checks from the LB).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: tmi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: take-my-interview
data:
  default.conf: |
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # Gzip + sensible defaults
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_min_length 1024;

        # Increase body size for voice-upload (max 25MB on the backend).
        client_max_body_size 30m;

        root   /usr/share/nginx/html;
        index  index.html;

        # Long-lived caching for hashed assets emitted by webpack.
        location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API proxy — backend service in the same namespace.
        location /api/ {
            proxy_pass         [REDACTED-URL]
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;     # Gemini calls can take a while
            proxy_send_timeout 120s;
            proxy_request_buffering off;
        }

        # React Router — fall back to index.html for any unknown path.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Lightweight health endpoint for k8s probes.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
