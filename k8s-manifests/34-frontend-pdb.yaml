# =============================================================================
# Frontend PodDisruptionBudget — keep at least one replica serving traffic
# during voluntary disruptions.
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: tmi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: take-my-interview
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: take-my-interview
