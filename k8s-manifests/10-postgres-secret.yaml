# =============================================================================
# PostgreSQL credentials.
# The placeholder values are committed here ONLY so a fresh `kubectl apply`
# works. Replace them with sealed/vault/external-secrets BEFORE any real
# deployment. See README.md for the recommended workflow.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: tmi
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: take-my-interview
type: Opaque
stringData:
  POSTGRES_DB: "tmi"
  POSTGRES_USER: "tmi"
  # PLACEHOLDER — generate a strong password via:
  #   openssl rand -base64 24
  POSTGRES_[REDACTED-GENERIC_SECRET]
