# =============================================================================
# Frontend ClusterIP service. Exposed to the outside world via Ingress.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tmi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: take-my-interview
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: take-my-interview
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
